name: Release

# Publishing happens here rather than from a laptop, and that is a security
# property rather than a convenience. `publishConfig.provenance` asks npm to
# record a signed, verifiable statement of which commit and which workflow
# produced the tarball, which requires an OIDC token only the CI runner can
# mint. A local `npm publish` cannot produce one, so it would either fail or
# silently ship an unattested package.
#
# The practical effect: anyone can check that the code on npm is the code in
# this repository, without trusting the maintainer's machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required to mint the OIDC token that backs provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # The tag is the only thing a human types, so it is the only thing that
      # can be wrong. Publishing 0.2.0 from a tag reading v0.3.0 would put a
      # version on npm that matches no release here, and npm versions are
      # immutable, so this check has to run before the publish rather than
      # after it.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      # Re-run the full gate here rather than trusting that CI passed on the
      # commit. A tag can point anywhere, including at a commit CI never saw.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built artifact
        run: node --test "test/package.test.ts"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
